services:
  - type: web
    name: meravyapar-ai-gateway
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.gateway_main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "MeraVyapar AI Stateless Gateway"
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_STR
        value: /api/v1
      - key: EXTERNAL_PROVIDER_MODE
        value: production
